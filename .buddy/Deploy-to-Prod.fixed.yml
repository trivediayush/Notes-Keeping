- pipeline: deploy-to-prod
  name: Deploy to Prod
  refs:
  - refs/heads/master
  fail_on_prepare_env_warning: true
  resources: NANO
  events:
  - type: WEBHOOK
  actions:
  - action: Clear cache
    type: CLEAR_CACHE
    disabled: true
    cache_types:
    - DOCKER
    - FILE_SYSTEM
    - SERVICES
    - ADDITIONAL
